[project]
name = "knowledge-system"
version = "0.1.0"
description = "Knowledge Unit extraction and content generation from books"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4",
    "openai>=1.0",
    "anthropic>=0.30",
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
